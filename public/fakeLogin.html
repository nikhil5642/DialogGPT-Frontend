<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8" />
		<title>Intent Race Test</title>
	</head>
	<body>
		<h3>Intent Race Test</h3>
		<div>
			<button onclick="handleIntentTrigger()">Test Intent</button>
		</div>
		<script>
			function handleIntentTrigger() {
				window.location =
					"intent://www.google.com#Intent;scheme=https;package=com.android.chrome;category=android.intent.category.BROWSABLE;end";
			}
		</script>
		<div id="log"></div>
	</body>
</html>
